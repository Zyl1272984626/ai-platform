# AI Platform 全局配置
#
# 所有敏感配置通过环境变量覆盖，不在此文件中硬编码密码

# 主系统路径
project:
  root: "E:/project/agent1"
  backend: "${project.root}/backend"
  frontend: "${project.root}/frontend"

# Claude Code 配置
claude:
  # 最大工具调用轮次（全自动模式）
  maxTurns: 50
  # 单步超时（毫秒）
  stepTimeout: 300000      # 5 min
  # 工作流总超时（毫秒）
  totalTimeout: 1800000    # 30 min
  # 自动审批的工具列表
  allowedTools:
    - Read
    - Write
    - Edit
    - MultiEdit
    - Glob
    - Grep
    - Bash
    - WebSearch
    - WebFetch

# 禅道配置
zentao:
  url: "${ZENTAO_URL:http://localhost:8080}"
  account: "${ZENTAO_ACCOUNT:bot}"
  password: "${ZENTAO_PASSWORD:}"

# 通知配置
notify:
  # 企业微信 Webhook
  wechatWebhook: "${WECHAT_WEBHOOK:}"
  # 邮件
  email:
    smtp: "${SMTP_HOST:}"
    port: 465
    from: "${EMAIL_FROM:}"
    to: []
    user: "${EMAIL_USER:}"
    password: "${EMAIL_PASSWORD:}"

# 默认学校配置模板
schoolDefaults:
  database: "AGENT_PORTAL"
  amapKey: "${AMAP_KEY:}"
  helperDialect:
    mysql: "mysql"
    dameng: "dm"
  dbDriver:
    mysql: "com.mysql.cj.jdbc.Driver"
    dameng: "dm.jdbc.driver.DmDriver"
  dbPort:
    mysql: 3306
    dameng: 5237

# 定时任务
cron:
  dailyCheck: "0 9 * * 1-5"     # 工作日 09:00
  # agentTest: "0 2 * * *"       # 每天凌晨 02:00
